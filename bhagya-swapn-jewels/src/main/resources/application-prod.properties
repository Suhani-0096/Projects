spring.application.name=bhagya-swapn-jewels

# Railway MySQL connection
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production database settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.org.springframework.security=WARN

# Owner credentials
app.owner.username=${APP_OWNER_USERNAME}
app.owner.password=${APP_OWNER_PASSWORD}

# Manager credentials
app.manager.username=${APP_MANAGER_USERNAME}
app.manager.password=${APP_MANAGER_PASSWORD}

# Railway port
server.port=${PORT:8080}

# Allow secure cross-site session cookies
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true